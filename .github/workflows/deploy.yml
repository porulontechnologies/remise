name: Deploy to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy Remise
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create deployment archive
        run: |
          tar \
            --warning=no-file-changed \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='*/.env' \
            --exclude='*/**/.env' \
            --exclude='mongodb-backup' \
            --exclude='node_modules' \
            --exclude='*/node_modules' \
            --exclude='*/**/node_modules' \
            --exclude='client/.next' \
            --exclude='*/.next' \
            -czf /tmp/remise-deploy.tar.gz . || [ $? -eq 1 ]

          mv /tmp/remise-deploy.tar.gz ./remise-deploy.tar.gz
          ls -lh remise-deploy.tar.gz

      - name: Deploy to VPS via SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_SSH_KEY" ]; then
            echo "ERROR: Missing required secrets (VPS_HOST, VPS_USER, or VPS_SSH_KEY)"
            exit 1
          fi

          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" | tr -d '\r' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          SSH_OPTS="-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=60 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          echo "=== Testing SSH connection to $VPS_HOST ==="
          ssh $SSH_OPTS -i ~/.ssh/id_rsa "${VPS_USER}@${VPS_HOST}" "echo 'SSH connection successful!'"

          echo "=== Uploading deployment archive ==="
          scp $SSH_OPTS -i ~/.ssh/id_rsa remise-deploy.tar.gz "${VPS_USER}@${VPS_HOST}:/root/remise-deploy.tar.gz"

          echo "=== Deploying and restarting Docker services ==="
          ssh $SSH_OPTS -i ~/.ssh/id_rsa "${VPS_USER}@${VPS_HOST}" << 'EOF'
            set -e
            PROJECT="/var/www/remise"
            ARCHIVE="/root/remise-deploy.tar.gz"

            echo "=== Checking deployment archive ==="
            if [ ! -f "$ARCHIVE" ]; then
              echo "ERROR: Deployment archive not found at $ARCHIVE"
              exit 1
            fi

            ls -lh "$ARCHIVE"

            echo "=== Preparing deployment ==="
            mkdir -p "$PROJECT"

            echo "=== Extracting new code ==="
            tar -xzf "$ARCHIVE" -C "$PROJECT"
            rm -f "$ARCHIVE"

            cd "$PROJECT"

            echo "=== Building and restarting Docker services ==="
            docker compose up -d --build

            echo "=== Cleaning unused Docker images ==="
            docker image prune -f

            echo "=== Checking services ==="
            docker compose ps

            echo "=== Deployment completed successfully ==="
          EOF